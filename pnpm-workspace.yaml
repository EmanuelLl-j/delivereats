packages:
  - apps/*
  - services/*
  - packages/*

injectWorkspacePackages: true

# Security patches for transitive dependencies; verify both Metro exports and server builds.
overrides:
  'qs@<6.16.0': '6.16.0'
  'effect@<3.20.0': '^3.20.0'
  'postcss@<8.5.18': '^8.5.18'
  'sharp@<0.35.0': '^0.35.0'
  'deepmerge-ts@<8.0.0': '^8.0.0'

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': false
  bcrypt: true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
