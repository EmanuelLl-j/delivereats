worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    '' $request_id;
  }

  upstream users_api { server users-service:3001; }
  upstream orders_api { server orders-service:3002; }
  upstream drivers_api { server drivers-service:3003; }
  upstream notifications_api { server notifications-service:3004; }
  upstream web_app { server web:3000; }

  server { listen 80; server_name _; return 308 https://$host$request_uri; }
  server {
    listen 443 ssl;
    http2 on;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;

    location ~ ^/api/(users|orders|drivers|notifications)/internal/ { return 404; }

    location /api/users/ {
      proxy_pass http://users_api/;
    }

    location /api/orders/ {
      proxy_pass http://orders_api/;
    }

    location /api/drivers/ {
      proxy_pass http://drivers_api/;
    }

    location /api/notifications/ {
      proxy_pass http://notifications_api/;
    }

    location /socket.io/orders {
      proxy_pass http://orders_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 65s;
    }

    location /socket.io/tracking {
      proxy_pass http://drivers_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 65s;
    }

    location /socket.io/communications {
      proxy_pass http://drivers_api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 65s;
    }

    location / {
      proxy_pass http://web_app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
